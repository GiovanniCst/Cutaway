[package]
name = "cutaway-editor"
version = "2.0.0"
edition = "2021"
description = "Cutaway - everything a picture needs before you send it"
license = "Apache-2.0"

[[bin]]
name = "Cutaway"
path = "src/main.rs"

[build-dependencies]
# Build only: it never reaches the binary. It finds the SDK's rc.exe and hands
# it the icon and the version fields - see build.rs.
winresource = "0.1"

[dependencies]
# Glow, not wgpu, and measured rather than assumed: 102 ms to a drawn window
# against 659 (2419 on the first run of the day), and half the binary. For a
# program that has to appear the instant a rectangle is released, that is the
# whole argument.
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "default_fonts",
] }
egui = "0.29"

# Already in the tree through eframe; named here because the rasteriser uses it
# directly to put text into pixels, and a dependency used on purpose should be
# declared on purpose.
ab_glyph = "0.2"

# The formats the Python editor reads and writes, minus the ones nothing asks
# for. Kept explicit so the binary does not quietly grow a decoder at a time.
# The AI edits are HTTPS calls with JSON bodies. ureq rather than reqwest: it is
# synchronous, which suits a call that happens on a worker thread and blocks
# nothing, and it does not drag in an async runtime for four requests.
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
serde_json = "1"

image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "tiff",
    "bmp",
    "gif",
] }

# The file dialogs, native rather than drawn: an open dialog that is not the
# system's own is immediately recognisable as not belonging.
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }

# Windows has an OCR engine of its own, reachable only through WinRT - which
# needs the richer bindings rather than the raw ones next door. Nothing else in
# this program uses it, so the feature list stays exactly as narrow as the task.
[dependencies.windows]
version = "0.58"
features = [
    "Media_Ocr",
    "Globalization",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation_Collections",
]

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
