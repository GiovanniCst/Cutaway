[package]
name = "cutaway-agent"
version = "2.0.0"
edition = "2021"
description = "Cutaway - the shortcut that cuts a piece of the screen"
license = "Apache-2.0"

[[bin]]
name = "CutawayAgent"
path = "src/main.rs"

[build-dependencies]
# Build only: it never reaches the binary. It finds the SDK's rc.exe and hands
# it the icon and the version fields - see build.rs.
winresource = "0.1"

[dependencies]
# Pure Rust, so it links on the gnu toolchain like everything else here. GDI+
# would have done the same job, at the cost of COM initialisation on the path
# that has to stay short.
png = "0.17"

# 0.59 and not 0.60: from 0.60 windows-sys links through raw-dylib, which on the
# gnu toolchain builds its import libraries with dlltool, and dlltool needs the
# GNU assembler that rustup does not ship. 0.59 goes through windows-targets,
# whose import libraries are already built.
[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Power",
    "Win32_Storage_FileSystem",
    "Win32_Security",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
